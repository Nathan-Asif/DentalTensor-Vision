[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentaltensor-vision"
version = "1.0.0"
description = "DentalTensor Vision v1.0 — Pre-trained oral pathology computer-vision model built on Ultralytics YOLO11n"
readme = "README.md"
authors = [
    { name = "Nathan Asif" }
]
license = "AGPL-3.0-only"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = [
    "dentaltensor",
    "computer-vision",
    "oral-pathology",
    "dentistry",
    "yolo11",
    "object-detection",
    "pre-trained",
    "inference",
]
dependencies = [
    "pydantic>=2.0.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0",
    "torch>=2.0.0",
    "ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
dentaltensor = "dentaltensor.cli:main"

[project.urls]
Homepage = "https://github.com/Nathan-Asif/DentalTensor-Vision"
Repository = "https://github.com/Nathan-Asif/DentalTensor-Vision"
Documentation = "https://github.com/Nathan-Asif/DentalTensor-Vision/tree/main/docs"
"Issue Tracker" = "https://github.com/Nathan-Asif/DentalTensor-Vision/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "model: integration tests requiring real model checkpoint (models/dentaltensor_vision_v1.0.pt)",
]
